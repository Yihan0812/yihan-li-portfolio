<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 309" role="img" aria-labelledby="title desc"><title id="title">Duplex DNase-mediated recognition and proposed reporter generation</title><desc id="desc">A DNA probe contains a barcode and RNA recognition region. Complementary RNA forms an antiparallel hybrid with DNA. Duplex DNase acts on DNA in the hybrid. A proposed barcode reporter has an unspecified endpoint. A separate dashed loop denotes possible reuse of the same RNA, not replication. Reporter integrity and recycling are unverified.</desc><g font-family="Arial, sans-serif"><text x="127" y="28" font-size="18" fill="#203b32" text-anchor="middle" >Probe + target RNA</text><text x="420" y="28" font-size="18" fill="#203b32" text-anchor="middle" >DNA–RNA hybrid</text><text x="715" y="28" font-size="18" fill="#203b32" text-anchor="middle" >Proposed DNA reporter</text><path d="M64 95L118 95" fill="none" stroke="#24594e" stroke-width="4"/><path d="M72 95L72 88" fill="none" stroke="#24594e" stroke-width="2"/><path d="M84 95L84 88" fill="none" stroke="#24594e" stroke-width="2"/><path d="M96 95L96 88" fill="none" stroke="#24594e" stroke-width="2"/><path d="M108 95L108 88" fill="none" stroke="#24594e" stroke-width="2"/><path d="M118 95L182 95" fill="none" stroke="#557f9a" stroke-width="4"/><path d="M126 95L126 88" fill="none" stroke="#557f9a" stroke-width="2"/><path d="M138 95L138 88" fill="none" stroke="#557f9a" stroke-width="2"/><path d="M150 95L150 88" fill="none" stroke="#557f9a" stroke-width="2"/><path d="M162 95L162 88" fill="none" stroke="#557f9a" stroke-width="2"/><path d="M174 95L174 88" fill="none" stroke="#557f9a" stroke-width="2"/><text x="40" y="101" font-size="13" fill="#24594e" text-anchor="start" >5′</text><text x="195" y="101" font-size="13" fill="#557f9a" text-anchor="start" >3′</text><text x="64" y="124" font-size="13" fill="#24594e" text-anchor="start" >Barcode</text><text x="156" y="124" font-size="13" fill="#557f9a" text-anchor="middle" >Recogn