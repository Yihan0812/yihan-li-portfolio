<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 844 301" role="img" aria-labelledby="title desc"><title id="title">Functional architecture of the proposed RNA probe</title><desc id="desc">An 83 nucleotide phosphorylated DNA probe comprises UNI code 20, ID code 24, LSP 5, RNA recognition region 24 and anchor 10 nucleotides in that 5 prime to 3 prime order. UNI and ID encode the signal. The target RNA sequence is shown 5 prime to 3 prime. No protective function is assigned to LSP or anchor.</desc><g font-family="Arial, sans-serif"><text x="30" y="34" font-size="12" fill="#64746b" text-anchor="start" >DNA PROBE / 83 nt DESIGN</text><text x="30" y="72" font-size="13" fill="#64746b" text-anchor="start" >5′-P</text><rect x="83" y="60" width="160" height="16" rx="3" fill="#24594e"/><text x="163.0" y="105" font-size="12" fill="#24594e" text-anchor="middle" >UNI code</text><text x="163.0" y="126" font-size="11" fill="#64746b" text-anchor="middle" >20 nt</text><rect x="243" y="60" width="192" height="16" rx="3" fill="#8b739f"/><text x="339.0" y="105" font-size="12" fill="#8b739f" text-anchor="middle" >ID code</text><text x="339.0" y="126" font-size="11" fill="#64746b" text-anchor="middle" >24 nt</text><rect x="435" y="60" width="40" height="16" rx="3" fill="#99a291"/><text x="455.0" y="105" font-size="12" fill="#99a291" text-anchor="middle" >LSP</text><text x="455.0" y="126" font-size="11" fill="#64746b" text-anchor="middle" >5 nt</text><rect x="475" y="60" width="192" height="16" rx="3" fill="#557f9a"/><text x="571.0" y="105" font-size="12" fill="#557f9a" text-anchor="middle" >RNA recognition</text><text x="571.0" y="126" font-size="11" fill="#64746b" text-anchor="middle" >24 nt</text><rect x="667" y="60" width="80" height="16" rx="3" fill="#a8b3b6"/><text x="707.0" y="105" font-size="12" fill="#a8b3b6" text-anchor="middle" >Anchor</text><text x="707.0" y="126" font-size="11" fill="#64746b" text-anchor="middle" >10 nt</text><text x="761" y="74" font-size="13" fill="#64746b" text-anchor="start" >3′</text><path d="M83 147L435 147" fill="none" stroke="#24594e" stroke-width="2"/><text x="259" y="170" font-size="13" fill="#24594e" text-anchor="middle" >Signal encoding · UNI + ID</text><path d="M475 147L667 147" fill="none" stroke="#557f9a" stroke-width="2"/><text x="571" y="170" font-size="13" fill="#557f9a" text-anchor="middle" >Molecular recognition</text><text x="35" y="213" font-size="11" fill="#64746b" text-anchor="start" >PROJECT TARGET RNA</text><text x="35" y="244" font-size="17" fill="#b66b46" text-anchor="start" font-family="monospace">5′-UAGCUUAUCAGACUGAUGUUGACU-3′</text><text x="35" y="275" font-size="12" fill="#64746b" text-anchor="start" >miR-21-5p · complementary to the DNA recognition region</text></g></svg>