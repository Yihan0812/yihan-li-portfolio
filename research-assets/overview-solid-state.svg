<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 255" role="img" aria-labelledby="title desc"><title id="title">Solid-state nanopore sensing</title><desc id="desc">A molecule passes through an artificial membrane aperture under an applied potential in electrolyte. An illustrative current blockade represents the electrical sensing principle, not a result or a specific Zhejiang experiment.</desc><g font-family="Arial, sans-serif"><rect x="45" y="45" width="330" height="176" rx="3" fill="#e8efea"/><rect x="63" y="121" width="116" height="35" rx="3" fill="#a6b6bd"/><rect x="217" y="121" width="139" height="35" rx="3" fill="#a6b6bd"/><circle cx="198" cy="76" r="11" fill="#b66b46"/><path d="M198 93L198 192" fill="none" stroke="#b66b46" stroke-width="1.6"/><path d="M194 187L198 192L202 187" fill="none" stroke="#b66b46" stroke-width="1.6"/><text x="81" y="197" font-size="15" fill="#64746b" text-anchor="start" >Electrolyte</text><text x="56" y="28" font-size="18" fill="#203b32" text-anchor="start" >Artificial membrane + nanopore</text><text x="293" y="79" font-size="22" fill="#557f9a" text-anchor="start" >−</text><text x="293" y="204" font-size="22" fill="#557f9a" text-anchor="start" >+</text><text x="303" y="102" font-size="13" fill="#64746b" text-anchor="start" >Applied</text><text x="303" y="119" font-size="13" fill="#64746b" text-anchor="start" >potential</text><path d="M402 136L460 136" fill="none" stroke="#64746b" stroke-width="1.6"/><path d="M455 132L460 136L455 140" fill="none" stroke="#64746b" stroke-width="1.6"/><text x="506" y="48" font-size="18" fill="#203b32" text-anchor="start" >Electrical event</text><path d="M509 193L807 193" fill="none" stroke="#bbc8b9" stroke-width="1"/><path d="M514 93H604V159H681V93H801" fill="none" stroke="#557f9a" stroke-width="2.5"/><text x="510" y="220" font-size="16" fill="#64746b" text-anchor="start" >Illustrative current blockade · time →</text></g></svg>