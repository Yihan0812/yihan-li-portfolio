<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 844 475" role="img" aria-labelledby="title desc"><title id="title">B1 and B3 reference barcode architecture</title><desc id="desc">Both phosphorylated DNA barcodes have a 15 nucleotide common region and a distinguishable 35 nucleotide region, oriented 5 prime to 3 prime. Complementary C strands are antiparallel and contain a 3 prime A overhang. Sequencing identifies each barcode so relative read counts can be compared. Not a library assembly protocol.</desc><g font-family="Arial, sans-serif"><text x="35" y="64" font-size="16" fill="#24594e" text-anchor="start" >B1 · target</text><text x="35" y="99" font-size="12" fill="#64746b" text-anchor="start" >5′-P</text><rect x="87" y="84" width="130" height="12" rx="3" fill="#a8b89a"/><rect x="217" y="84" width="326" height="12" rx="3" fill="#24594e"/><text x="559" y="99" font-size="12" fill="#64746b" text-anchor="start" >3′</text><text x="152" y="172" font-size="11" fill="#64746b" text-anchor="middle" >Common region · 15 nt</text><text x="380" y="122" font-size="11" fill="#24594e" text-anchor="middle" >Barcode-specific region · 35 nt</text><path d="M84 145L214 145" fill="none" stroke="#a8b89a" stroke-width="4"/><path d="M92 145L92 138" fill="none" stroke="#a8b89a" stroke-width="2"/><path d="M104 145L104 138" fill="none" stroke="#a8b89a" stroke-width="2"/><path d="M116 145L116 138" fill="none" stroke="#a8b89a" stroke-width="2"/><path d="M128 145L128 138" fill="none" stroke="#a8b89a" stroke-width="2"/><path d="M140 145L140 138" fill="none" stroke="#a8b89a" stroke-width="2"/><path d="M152 145L152 138" fill="none" stroke="#a8b89a" stroke-width="2"/><path d="M164 145L164 138" fill="none" stroke="#a8b89a" stroke-width="2"/><path d="M176 145L176 138" fill="none" stroke="#a8b89a" stroke-width="2"/><path d="M188 145L188 138" fill="none" stroke="#a8b89a" stroke-width="2"/><path d="M200 145L200 138" fill="none" stroke="#a8b89a" stroke-width="2"/><path d="M212 145L212 138" fill="none"