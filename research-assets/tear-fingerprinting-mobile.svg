<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 2050" role="img" aria-labelledby="title desc"><title id="title">Tear-based solid-state nanopore fingerprinting</title><desc id="desc">Conceptual workflow: dry eye and control tear samples, solid membrane nanopore under applied potential, illustrative ionic-current events, feature extraction, overlapping feature-space patterns, and exploratory classification. No measured results or molecular identities.</desc><rect width="400" height="2050" fill="white"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#777" stroke-width="1.2"/></marker></defs><style>text{font:20px Arial,Helvetica,sans-serif;fill:#252525}.head{font-size:21px;font-weight:600}.num{font-size:15px;fill:#777}.small{font-size:16px;fill:#626262}.tiny{font-size:13px;fill:#555}.line,.rule,.arrow{fill:none;stroke:#777;stroke-width:1.5}.rule{stroke:#ddd}.arrow{marker-end:url(#a)}.membrane{fill:#ececec;stroke:#888;stroke-width:1.5}.electrode{fill:none;stroke:#555;stroke-width:3}.molecule,.signal,.features{fill:none;stroke:#426883;stroke-width:2}.features{stroke-width:4}</style><g transform="translate(25 20)"><text x="0" y="25" class="num">01</text><text x="35" y="25" class="head">Tear samples</text><path d="M0 42H350" class="rule" /><path d="M52 72c-12 21-22 29-22 43a22 22 0 0 0 44 0c0-14-10-22-22-43Z" fill="none" stroke="#426883" stroke-width="2"/><path d="M52 172c-12 21-22 29-22 43a22 22 0 0 0 44 0c0-14-10-22-22-43Z" fill="none" stroke="#426883" stroke-width="2"/><text x="100" y="105" class="">Dry eye disease</text><text x="100" y="205" class="">Non-dry-eye controls</text><text x="0" y="270" class="small">Complex molecular mixtures</text></g><path d="M200 320V345" class="arrow" /><g transform="translate(25 360)"><text x="0" y="25" class="num">02</text><text x="35" y="25" class="head">Solid-state nanopore sensing</text><path d="M0 42H350" class="rule" /><text x="0" y="75" class="small">Electrolyte reservoirs</text><path d="M20 145H140L157 170L140 195H20Z M330 145H205L188 170L205 195H330Z" class="membrane" /><text x="24" y="174" class="tiny">Solid membrane</text><path d="M50 105V135 M50 205V232" class="electrode" /><text x="20" y="120" class="">+</text><text x="20" y="231" class="">−</text><path d="M50 100H5V240H50" class="line" /><text x="66" y="233" class="small">Applied potential</text><path d="M168 83C149 103 190 114 171 136" class="molecule" /><path d="M174 139V202" class="arrow" /><circle cx="144" cy="111" r="3" fill="#777"/><circle cx="210" cy="109" r="3" fill="#777"/><circle cx="145" cy="225" r="3" fill="#777"/><circle cx="215" cy="217" r="3" fill="#777"/><text x="0" y="270" class="small">Ionic transport + molecular interactions</text></g><path d="M200 660V685" class="arrow" /><g transform="translate(25 700)"><text x="0" y="25" class="num">03</text><text x="35" y="25" class="head">Ionic-current signals</text><path d="M0 42H350" class="rule" /><path d="M20 70V220H345" class="line" /><text x="0" y="80" class="small">I</text><text x="310" y="244" class="small">Time</text><path d="M30 100H65V144H79V100H110L115 122L124 135L132 119L136 100H180V177H216V100H248V130H260V100H340" class="signal" /><text x="0" y="270" class="small">Conceptual traces; not recordings</text></g><path d="M200 1000V1025" class="arrow" /><g transform="translate(25 1040)"><text x="0" y="25" class="num">04</text><text x="35" y="25" class="head">Signal fingerprinting</text><path d="M0 42H350" class="rule" /><text x="0" y="89" class="">Signal processing</text><path d="M90 103V120" class="arrow" /><text x="0" y="145" class="">Feature extraction</text><text x="0" y="177" class="small">Amplitude · duration · shape</text><path d="M20 222H75M20 240H105M20 258H56 M145 222H230M145 240H200M145 258H254" class="features" /><text x="0" y="293" class="small">Collective features, not chemical identities</text></g><path d="M200 1340V1365" class="arrow" /><g transform="translate(25 1380)"><text x="0" y="25" class="num">05</text><text x="35" y="25" class="head">Machine learning</text><path d="M0 42H350" class="rule" /><text x="0" y="77" class="">Pattern analysis</text><path d="M38 98V244H330" class="line" /><circle cx="70" cy="211" r="5" fill="#426883"/><circle cx="108" cy="165" r="5" fill="#426883"/><circle cx="148" cy="206" r="5" fill="#426883"/><circle cx="177" cy="154" r="5" fill="#426883"/><circle cx="210" cy="181" r="5" fill="#426883"/><circle cx="245" cy="134" r="5" fill="#426883"/><circle cx="282" cy="172" r="5" fill="#426883"/><circle cx="130" cy="132" r="5" fill="#426883"/><circle cx="102" cy="208" r="5" fill="white" stroke="#7b6a5b" stroke-width="2"/><circle cx="138" cy="176" r="5" fill="white" stroke="#7b6a5b" stroke-width="2"/><circle cx="185" cy="212" r="5" fill="white" stroke="#7b6a5b" stroke-width="2"/><circle cx="198" cy="137" r="5" fill="white" stroke="#7b6a5b" stroke-width="2"/><circle cx="224" cy="159" r="5" fill="white" stroke="#7b6a5b" stroke-width="2"/><circle cx="261" cy="200" r="5" fill="white" stroke="#7b6a5b" stroke-width="2"/><circle cx="298" cy="140" r="5" fill="white" stroke="#7b6a5b" stroke-width="2"/><circle cx="164" cy="159" r="5" fill="white" stroke="#7b6a5b" stroke-width="2"/><text x="0" y="275" class="small">● Dry eye     ○ Controls</text><text x="0" y="303" class="small">Illustrative feature space; groups overlap</text></g><path d="M200 1680V1705" class="arrow" /><g transform="translate(25 1720)"><text x="0" y="25" class="num">06</text><text x="35" y="25" class="head">Exploratory classification</text><path d="M0 42H350" class="rule" /><text x="0" y="97" class="">Exploring disease-associated</text><text x="0" y="130" class="">differences in molecular</text><text x="0" y="163" class="">signal fingerprints</text><text x="0" y="229" class="small">Research objective</text><text x="0" y="259" class="small">No diagnostic performance implied</text></g></svg>