<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 844 407" role="img" aria-labelledby="title desc"><title id="title">Solid-state nanopore and current blockade</title><desc id="desc">A molecule moves through a nanoscale opening in an artificial solid membrane separating electrolytes. An applied potential drives ionic current. A generic event reduces current for a finite duration in this illustration. No specific membrane material or fabrication method is assigned to the Zhejiang work.</desc><g font-family="Arial, sans-serif"><rect x="111" y="103" width="270" height="168" rx="0" fill="#eef3ef"/><rect x="116" y="173" width="104" height="33" rx="1" fill="#a6b6bd"/><rect x="272" y="173" width="104" height="33" rx="1" fill="#a6b6bd"/><path d="M220 173L220 206" fill="none" stroke="#557f9a" stroke-width="2"/><path d="M272 173L272 206" fill="none" stroke="#557f9a" stroke-width="2"/><circle cx="156" cy="130" r="6" fill="#dae6dc"/><text x="156" y="133" font-size="9" fill="#24594e" text-anchor="middle" >+</text><circle cx="322" cy="144" r="6" fill="#dae6dc"/><text x="322" y="147" font-size="9" fill="#557f9a" text-anchor="middle" >−</text><circle cx="182" cy="239" r="6" fill="#dae6dc"/><text x="182" y="242" font-size="9" fill="#557f9a" text-anchor="middle" >−</text><circle cx="332" cy="244" r="6" fill="#dae6dc"/><text x="332" y="247" font-size="9" fill="#24594e" text-anchor="middle" >+</text><path d="M303 147L303 231" fill="none" stroke="#557f9a" stroke-width="1.6"/><path d="M299 226L303 231L307 226" fill="none" stroke="#557f9a" stroke-width="1.6"/><text x="315" y="190" font-size="10" fill="#557f9a" text-anchor="start" >ion flow</text><text x="30" y="31" font-size="12" fill="#64746b" text-anchor="start" >SOLID-STATE NANOPORE / CROSS-SECTION</text><circle cx="246" cy="97" r="12" fill="#b66b46"/><circle cx="240" cy="87" r="9" fill="#b66b46"/><circle cx="255" cy="88" r="8" fill="#b66b46"/><path d="M246 118L246 232" fill="none" stroke="#b66b46" stroke-width="1.6"/><path d="M242 227L246 232L250 227" fill="none" stroke="#b66b46" stroke-width="1.6"/><text x="56" y="84" font-size="13" fill="#b66b46" text-anchor="start" >Molecule</text><path d="M122 88L224 95" fill="none" stroke="#b66b46" stroke-width="1"/><text x="48" y="171" font-size="12" fill="#64746b" text-anchor="start" >Solid membrane</text><path d="M137 176L155 189" fill="none" stroke="#64746b" stroke-width="1"/><text x="282" y="148" font-size="12" fill="#557f9a" text-anchor="start" >Pore</text><path d="M279 151L265 173" fill="none" stroke="#557f9a" stroke-width="1"/><text x="100" y="265" font-size="11" fill="#64746b" text-anchor="start" >Electrolyte on both sides</text><path d="M111 120L85 120" fill="none" stroke="#64746b" stroke-width="1.4"/><path d="M85 120L85 309" fill="none" stroke="#64746b" stroke-width="1.4"/><path d="M85 309L414 309" fill="none" stroke="#64746b" stroke-width="1.4"/><path d="M414 309L414 248" fill="none" stroke="#64746b" stroke-width="1.4"/><path d="M414 248L373 248" fill="none" stroke="#64746b" stroke-width="1.4"/><circle cx="246" cy="309" r="22" fill="#f8f8f2"/><text x="246" y="315" font-size="17" fill="#24594e" text-anchor="middle" >V</text><text x="207" y="314" font-size="14" fill="#64746b" text-anchor="middle" >−</text><text x="284" y="314" font-size="14" fill="#64746b" text-anchor="middle" >+</text><text x="527" y="80" font-size="16" fill="#203b32" text-anchor="start" >Illustrative current blockade</text><path d="M529 117L529 237" fill="none" stroke="#b9c8b9" stroke-width="1"/><path d="M529 237L798 237" fill="none" stroke="#b9c8b9" stroke-width="1"/><path d="M539 147H615V204H678V147H790" fill="none" stroke="#557f9a" stroke-width="2.5"/><text x="538" y="130" font-size="11" fill="#64746b" text-anchor="start" >Open-pore level</text><text x="648" y="223" font-size="11" fill="#557f9a" text-anchor="middle" >Event</text><text x="797" y="259" font-size="11" fill="#64746b" text-anchor="end" >time →</text><text x="531" y="299" font-size="12" fill="#64746b" text-anchor="start" >Depth: change in ionic current</text><text x="531" y="324" font-size="12" fill="#64746b" text-anchor="start" >Width: event duration</text><text x="422" y="379" font-size="12" fill="#64746b" text-anchor="middle" >A conceptual blockade. Signals depend on the molecule, pore and solution conditions.</text></g></svg>