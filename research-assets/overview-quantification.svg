<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 255" role="img" aria-labelledby="title desc"><title id="title">Reference-based DNA barcode quantification</title><desc id="desc">B1 target and B3 internal reference enter the same ONT protein pore sequencing workflow. Sequence-based identity supports separate read counts and relative quantification. Calibration is required; no concentration or experimental results are shown.</desc><g font-family="Arial, sans-serif"><text x="30" y="61" font-size="18" fill="#24594e" text-anchor="start" >B1 · target</text><path d="M30 91L125 91" fill="none" stroke="#24594e" stroke-width="4"/><path d="M38 91L38 84" fill="none" stroke="#24594e" stroke-width="2"/><path d="M50 91L50 84" fill="none" stroke="#24594e" stroke-width="2"/><path d="M62 91L62 84" fill="none" stroke="#24594e" stroke-width="2"/><path d="M74 91L74 84" fill="none" stroke="#24594e" stroke-width="2"/><path d="M86 91L86 84" fill="none" stroke="#24594e" stroke-width="2"/><path d="M98 91L98 84" fill="none" stroke="#24594e" stroke-width="2"/><path d="M110 91L110 84" fill="none" stroke="#24594e" stroke-width="2"/><path d="M122 91L122 84" fill="none" stroke="#24594e" stroke-width="2"/><text x="30" y="133" font-size="18" fill="#557f9a" text-anchor="start" >B3 · reference</text><path d="M30 158L125 158" fill="none" stroke="#557f9a" stroke-width="4"/><path d="M38 158L38 151" fill="none" stroke="#557f9a" stroke-width="2"/><path d="M50 158L50 151" fill="none" stroke="#557f9a" stroke-width="2"/><path d="M62 158L62 151" fill="none" stroke="#557f9a" stroke-width="2"/><path d="M74 158L74 151" fill="none" stroke="#557f9a" stroke-width="2"/><path d="M86 158L86 151" fill="none" stroke="#557f9a" stroke-width="2"/><path d="M98 158L98 151" fill="none" stroke="#557f9a" stroke-width="2"/><path d="M110 158L110 151" fill="none" stroke="#557f9a" stroke-width="2"/><path d="M122 158L122 151" fill="none" stroke="#557f9a" stroke-width="2"/><text x="151" y="106" font-size="22" fill="#64746b" text-anchor="middle" >+</text><path d="M164 121L207 121" fill="none" stroke="#64746b" stroke-width="1.6"/><path d="M202 117L207 121L202 125" fill="none" stroke="#64746b" stroke-width="1.6"/><rect x="220" y="120" width="52" height="28" rx="3" fill="#c5d1bb"/><rect x="308" y="120" width="52" height="28" rx="3" fill="#c5d1bb"/><path d="M259 107Q244 81 271 87L281 165H265Z M321 107Q336 81 309 87L299 165H315Z" fill="#24594e"/><path d="M290 59Q276 76 290 93T290 173" fill="none" stroke="#24594e" stroke-width="3"/><text x="290" y="217" font-size="18" fill="#203b32" text-anchor="middle" >ONT sequencing</text><path d="M373 121L416 121" fill="none" stroke="#64746b" stroke-width="1.6"/><path d="M411 117L416 121L411 125" fill="none" stroke="#64746b" stroke-width="1.6"/><text x="444" y="76" font-size="18" fill="#203b32" text-anchor="start" >Sequence identity</text><text x="444" y="118" font-size="17" fill="#24594e" text-anchor="start" font-family="monospace">…ACGT…   B1</text><text x="444" y="153" font-size="17" fill="#557f9a" text-anchor="start" font-family="monospace">…TGCA…   B3</text><path d="M633 121L676 121" fill="none" stroke="#64746b" stroke-width="1.6"/><path d="M671 117L676 121L671 125" fill="none" stroke="#64746b" stroke-width="1.6"/><text x="751" y="112" font-size="22" fill="#203b32" text-anchor="middle" >B1 / B3</text><text x="751" y="146" font-size="17" fill="#64746b" text-anchor="middle" >read ratio</text><text x="751" y="217" font-size="16" fill="#203b32" text-anchor="middle" >Relative quantification</text></g></svg>