<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 1570" role="img" aria-labelledby="title"><title id="title">Notebook Et3N and KHMDS activation hypotheses</title><rect width="1420" height="1570" fill="white"/><defs><marker id="a" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><path d="M0 0L8 3.5L0 7Z" fill="#191919"/></marker></defs><style>text{font:22px Arial,Helvetica,sans-serif;fill:#191919}.head{font-size:27px;font-weight:600}.sub{font-size:22px;font-weight:600}.small{font-size:18px;fill:#555}.tiny{font-size:16px;fill:#666}.atom{font-size:25px}.arrow{fill:none;stroke:#191919;stroke-width:1.6;marker-end:url(#a)}</style><text x="30" y="42" class="head" text-anchor="start">02  Alternative activation hypotheses</text><text x="30" y="78" class="small" text-anchor="start">Different formal roles for Et₃N and KHMDS; none of these drawings establishes an elementary step.</text><text x="30" y="135" class="sub" text-anchor="start">Et₃N at sulfur · notebook p. 6</text><text x="65" y="233" class="" text-anchor="start">Et₃N + Ph–S–S–Ph</text><path d="M360,225L525,225" class="arrow"/><path d="M739.0,225.0L821.0,225.0" fill="none" stroke="#191919" stroke-width="1.8"/><text x="725" y="233" class="atom" text-anchor="middle">N</text><text x="835" y="233" class="atom" text-anchor="middle">S</text><path d="M850.0,225.0L883.0,225.0" fill="none" stroke="#191919" stroke-width="1.8"/><text x="900" y="232" class="" text-anchor="middle">Ph</text><path d="M715.2492005820322,211.07441524708713L697.4683310551497,185.6807018741284" fill="none" stroke="#191919" stroke-width="1.8"/><text x="683.1" y="172.2" class="" text-anchor="middle">Et</text><path d="M715.2492005820322,238.92558475291287L697.4683310551497,264.3192981258716" fill="none" stroke="#191919" stroke-width="1.8"/><text x="683.1" y="291.8" class="" text-anchor="middle">Et</text><path d="M708.0,225.0L655.0,225.0" fill="none" stroke="#191919" stroke-width="1.8"/><text x="635" y="232" class="" text-anchor="middle">Et</text><text x="743" y="205" class="atom" text-anchor="start">+</text><text x="1060" y="233" class="" text-anchor="start">+ Ph–S⁻</text><text x="30" y="354" class="sub" text-anchor="start">KHMDS at sulfur · pp. 1–2, 8–9</text><text x="35" y="465" class="" text-anchor="start">K⁺ [N(SiMe₃)₂]⁻ + Ph–S–S–Ph</text><path d="M440,457L575,457" class="arrow"/><path d="M744.0,457.0L826.0,457.0" fill="none" stroke="#191919" stroke-width="1.8"/><text x="730" y="465" class="atom" text-anchor="middle">N</text><text x="840" y="465" class="atom" text-anchor="middle">S</text><path d="M855.0,457.0L888.0,457.0" fill="none" stroke="#191919" stroke-width="1.8"/><text x="905" y="464" class="" text-anchor="middle">Ph</text><path d="M720.2492005820322,443.07441524708713L702.4683310551497,417.6807018741284" fill="none" stroke="#191919" stroke-width="1.8"/><text x="688.1" y="404.2" class="" text-anchor="middle">SiMe₃</text><path d="M720.2492005820322,470.92558475291287L702.4683310551497,496.3192981258716" fill="none" stroke="#191919" stroke-width="1.8"/><text x="688.1" y="523.8" class="" text-anchor="middle">SiMe₃</text><text x="1060" y="465" class="" text-anchor="start">+ K⁺ Ph–S⁻</text><text x="30" y="570" class="small" text-anchor="start">PhS–N(SiMe₃)₂ is a notebook-reported / tentative GC–MS assignment, not an established isolated intermediate.</text><text x="30" y="639" class="sub" text-anchor="start">Direct P attack · “route 1” (pp. 1–2) and Et₃N alternative (p. 6)</text><path d="M154.75,800.0L235.25,800.0" fill="none" stroke="#191919" stroke-width="1.8"/><path d="M127.7291847198287,787.9791847198287L118.36001986910694,778.610019869107" fill="none" stroke="#191919" stroke-width="1.8"/><text x="100.7" y="767.9" class="" text-anchor="middle">PhS</text><path d="M127.7291847198287,812.0208152801713L118.36001986910694,821.389980130893" fill="none" stroke="#191919" stroke-width="1.8"/><text x="100.7" y="846.1" class="" text-anchor="middle">PhS</text><text x="139.75" y="808.0" class="atom" text-anchor="middle">P</text><path d="M262.2708152801713,787.9791847198287L271.6399801308931,778.610019869107" fill="none" stroke="#191919" stroke-width="1.8"/><text x="289.3" y="767.9" class="" text-anchor="middle">SPh</text><path d="M262.2708152801713,812.0208152801713L271.6399801308931,821.389980130893" fill="none" stroke="#191919" stroke-width="1.8"/><text x="289.3" y="846.1" class="" text-anchor="middle">SPh</text><text x="250.25" y="808.0" class="atom" text-anchor="middle">P</text><text x="195" y="916" class="small" text-anchor="middle">+ KHMDS</text><path d="M390,800L525,800" class="arrow"/><text x="680" y="808" class="atom" text-anchor="middle">P</text><text x="790" y="808" class="atom" text-anchor="middle">N</text><path d="M694.0,800.0L776.0,800.0" fill="none" stroke="#191919" stroke-width="1.8"/><path d="M667.8518943621552,789.5873380247045L628.9814150591324,756.2697843363992" fill="none" stroke="#191919" stroke-width="1.8"/><text x="610" y="747" class="" text-anchor="middle">PhS</text><path d="M667.8518943621552,810.4126619752955L628.9814150591324,843.7302156636008" fill="none" stroke="#191919" stroke-width="1.8"/><text x="610" y="867" class="" text-anchor="middle">PhS</text><path d="M803.2747697605315,789.3801841915748L845.4782797639242,755.6173761888606" fill="none" stroke="#191919" stroke-width="1.8"/><text x="865" y="747" class="" text-anchor="middle">SiMe₃</text><path d="M803.2747697605315,810.6198158084252L845.4782797639242,844.3826238111394" fill="none" stroke="#191919" stroke-width="1.8"/><text x="865" y="867" class="" text-anchor="middle">SiMe₃</text><text x="980" y="808" class="" text-anchor="start">+ K⁺</text><text x="1180" y="808" class="atom" text-anchor="middle">P</text><text x="1152" y="782" class="atom" text-anchor="start">−</text><path d="M1193.4479007299135,789.6002901022002L1235.223675397186,757.293691026176" fill="none" stroke="#191919" stroke-width="1.8"/><text x="1255" y="749" class="" text-anchor="middle">SPh</text><path d="M1