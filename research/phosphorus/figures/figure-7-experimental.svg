<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 975" role="img" aria-labelledby="title"><title id="title">Question-linked NMR controls trapping and GCMS investigation</title><rect width="1450" height="975" fill="white"/><defs><marker id="a" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><path d="M0 0L8 3.5L0 7Z" fill="#191919"/></marker></defs><style>text{font:22px Arial,Helvetica,sans-serif;fill:#191919}.head{font-size:27px;font-weight:600}.sub{font-size:22px;font-weight:600}.small{font-size:18px;fill:#555}.tiny{font-size:16px;fill:#666}.atom{font-size:25px}.arrow{fill:none;stroke:#191919;stroke-width:1.6;marker-end:url(#a)}</style><text x="30" y="42" class="head" text-anchor="start">07  Experimental investigation of mechanistic hypotheses</text><text x="30" y="80" class="small" text-anchor="start">Parallel questions and evidence limits; not a sequence of conclusive results.</text><text x="30" y="150" class="sub" text-anchor="start">NMR monitoring</text><text x="390" y="150" class="" text-anchor="start">Which mixtures change with time?</text><path d="M30,171L1390,171" fill="none" stroke="#191919" stroke-width="1.8"/><text x="390" y="208" class="small" text-anchor="start">Project-level monitoring reported; nucleus, shifts and time points not recovered.</text><text x="30" y="310" class="sub" text-anchor="start">Reagent controls</text><text x="390" y="310" class="" text-anchor="start">Does disulfide/base chemistry occur without P₄?</text><path d="M30,331L1390,331" fill="none" stroke="#191919" stroke-width="1.8"/><text x="390" y="368" class="small" text-anchor="start">p. 1 compares phenyl / para-chlorophenyl disulfides ± KHMDS.</text><text x="30" y="470" class="sub" text-anchor="start">Trapping strategies</text><text x="390" y="470" class="" text-anchor="start">Can a transient species be made distinguishable?</text><path d="M30,491L1390,491" fill="none" stroke="#191919" stroke-width="1.8"/><text x="390" y="528" class="small" text-anchor="start">Mixed-disulfide strategy; bulky / Lewis-pair P₃ trapping plans remain incomplete.</text><text x="30" y="630" class="sub" text-anchor="start">GC–MS investigation</text><text x="390" y="630" class="" text-anchor="start">Which candidate sulfur species could explain the peaks?</text><path d="M30,651L1390,651" fill="none" stroke="#191919" stroke-width="1.8"/><text x="390" y="688" class="small" text-anchor="start">p. 1: five peaks, tentative names; no masses, spectra or definitive identities.</text><text x="30" y="790" class="sub" text-anchor="start">Reassessment</text><text x="390" y="790" class="" text-anchor="start">Is a mixed disulfide unique evidence of an intermediate?</text><path d="M30,811L1390,811" fill="none" stroke="#191919" stroke-width="1.8"/><text x="390" y="848" class="small" text-anchor="start">p. 9: background exchange / light may provide another explanation.</text><text x="30" y="930" class="tiny" text-anchor="start">A reported PhS–N(SiMe₃)₂ assignment is not an established isolated intermediate or a complete mechanism.</text></svg>