<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1695" role="img" aria-labelledby="title desc"><title id="title">Candidate phosphorus connectivity pathways</title><desc id="desc">P1 to P4 labels track a formal thiolate attack, anionic first-cleavage candidate and disulfide capture, then non-equivalent adjacent and opposite cleavage branches. Subsequent star and chain candidates are hypothetical, not proven intermediates.</desc><rect width="1500" height="1695" fill="white"/><defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0L9,3.5L0,7Z" fill="#171717"/></marker></defs><style>text{font:22px Arial,Helvetica,sans-serif;fill:#171717}.atom{font-size:25px}.small{font-size:18px;fill:#555}.tiny{font-size:16px;fill:#626262}.heading{font-size:25px;font-weight:600}.status{font-size:18px;font-weight:600}.arrow{fill:none;stroke:#171717;stroke-width:1.6;marker-end:url(#arrow)}</style><text x="30.0" y="37.0" class="heading" text-anchor="start">02  Literature motif and hypothetical P₄ connectivity pathways</text><text x="30.0" y="70.0" class="small" text-anchor="start">Structures below are formal connectivity hypotheses, not published intermediates or optimised geometries.</text><text x="200.0" y="130.0" class="status" text-anchor="middle">P₄</text><text x="700.0" y="130.0" class="status" text-anchor="middle">I1 · Hypothetical Intermediate</text><text x="1200.0" y="130.0" class="status" text-anchor="middle">N1 · Hypothetical Intermediate</text><path d="M192.8,211.8 L129.2,307.8" fill="none" stroke="#a24d42" stroke-width="1.8"/><path d="M207.2,211.8 L270.8,307.8" fill="none" stroke="#171717" stroke-width="1.8"/><path d="M200.0,214.0 L200.0,268.4" fill="none" stroke="#171717" stroke-width="1.8"/><path d="M135.0,318.6 L265.0,318.6" fill="none" stroke="#171717" stroke-width="1.8" stroke-dasharray="5 4"/><path d="M133.7,313.0 L188.3,287.0" fill="none" stroke="#171717" stroke-width="1.8"/><path d="M266.3,313.0 L211.7,287.0" fi