xt><text x="400.0" y="1432.0" class="status" text-anchor="middle">A3 · Hypothetical Intermediate · star</text><text x="1100.0" y="1432.0" class="status" text-anchor="middle">B3 · Hypothetical Intermediate · chain</text><text x="30.0" y="1490.0" class="small" text-anchor="start">Each lower arrow repeats the two-step motif with one PhSSPh; it is not a single elementary step.</text><text x="30.0" y="1524.0" class="small" text-anchor="start">Symmetry: initial six edges equivalent. In N1, {13,14,23,24} are equivalent; {34} is distinct.</text><text x="30.0" y="1558.0" class="small" text-anchor="start">Only representative later branches shown. Neutral P: 3 bonds; I1 P2: 2 bonds, charge −1. SPh = S–phenyl.</text><text x="30.0" y="1592.0" class="tiny" text-anchor="start">Red: bond selected for cleavage. Green: newly installed P–S bond. Dashed P2–P3 is a P–P bond, not a missing edge.</text><text x="30.0" y="1626.0" class="tiny" text-anchor="start">Thiolate initiation under Et₃N and the existence of these labelled candidates remain unassigned.</text><text x="30.0" y="1660.0" class="tiny" text-anchor="start">Motif: Horsley Downie et al., DOI 10.1002/cssc.202401895, Scheme 2(c), CC BY 4.0; labelled graphs are new hypotheses.</text></svg>