<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 750" role="img" aria-labelledby="title desc"><title id="title">Computational and experimental investigation workflow</title><desc id="desc">Parallel computational and experimental research streams. Candidate generation, Gaussian optimisation and chemical plausibility are compared with NMR monitoring, reagent controls, trapping attempts and analysis whose exact technique is unconfirmed. No mechanism is claimed established.</desc><rect width="1420" height="750" fill="white"/><defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0L9,3.5L0,7Z" fill="#171717"/></marker></defs><style>text{font:22px Arial,Helvetica,sans-serif;fill:#171717}.atom{font-size:25px}.small{font-size:18px;fill:#555}.tiny{font-size:16px;fill:#626262}.heading{font-size:25px;font-weight:600}.status{font-size:18px;font-weight:600}.arrow{fill:none;stroke:#171717;stroke-width:1.6;marker-end:url(#arrow)}</style><text x="30.0" y="42.0" class="heading" text-anchor="start">03  Computational and experimental investigation</text><text x="30.0" y="80.0" class="small" text-anchor="start">Research approach; a complete reaction mechanism was not established.</text><text x="40.0" y="145.0" class="status" text-anchor="start">COMPUTATIONAL INVESTIGATION</text><path d="M40.0,163.0 L650.0,163.0" fill="none" stroke="#171717" stroke-width="1.8"/><text x="40.0" y="211.0" class="" text-anchor="start">Candidate reaction pathway generation</text><path d="M315,235L315,277" class="arrow"/><text x="40.0" y="316.0" class="" text-anchor="start">Gaussian-based geometry optimisation</text><path d="M315,340L315,382" class="arrow"/><text x="40.0" y="422.0" class="" text-anchor="start">Evaluate alternative P-containing structures</text><path d="M315,446L315,488" class="arrow"/><text x="40.0" y="528.0" class="" text-anchor="start">Challenge: chemically plausible optimised geometries</text><text x="40.0" y="565.0" class="small" text-anchor="start">Connectivity and valence must be checked after optimisation.</text><text x="40.0" y="596.0" class="tiny" text-anchor="start">No converged minima, energies or transition states are assigned here.</text><text x="755.0" y="145.0" class="status" text-anchor="start">EXPERIMENTAL INVESTIGATION</text><path d="M755.0,163.0 L1370.0,163.0" fill="none" stroke="#171717" stroke-width="1.8"/><text x="755.0" y="211.0" class="" text-anchor="start">Time-resolved NMR reaction monitoring</text><path d="M1050,235L1050,277" class="arrow"/><text x="755.0" y="316.0" class="" text-anchor="start">Controls: compare P₄ / PhSSPh / Et₃N combinations</text><path d="M1050,340L1050,382" class="arrow"/><text x="755.0" y="422.0" class="" text-anchor="start">Attempts to trap reactive intermediates</text><path d="M1050,446L1050,488" class="arrow"/><text x="755.0" y="528.0" class="" text-anchor="start">Subsequent chromatographic or MS analysis</text><text x="755.0" y="565.0" class="small" text-anchor="start">Exact analytical technique remains unconfirmed.</text><text x="755.0" y="596.0" class="tiny" text-anchor="start">No trapped-intermediate assignment or experimental outcome implied.</text><path d="M40.0,654.0 L1370.0,654.0" fill="none" stroke="#171717" stroke-width="1.8"/><text x="40.0" y="703.0" class="status" text-anchor="start">Interpretation: compare candidate structures with experimental evidence; retain unresolved assignments.</text></svg>